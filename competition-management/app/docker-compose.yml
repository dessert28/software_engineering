# 一键起「后端 + 前端」两容器。
#
#   docker compose up --build
#
# 前端  http://127.0.0.1:5173
# 接口  http://127.0.0.1:8000/docs
#
# 暂不引入 Redis / Celery / MinIO —— 初版没有异步任务和对象存储依赖，
# 加进去只会增加启动负担。需要时按 docs/tech-stack/tech-stack-python.md 补齐。

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmcm-app:0.1.0
    command: ["api"]
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////data/mmcm.db"
      STORAGE_LOCAL_ROOT: "/data/uploads"
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      SECRET_KEY: "${SECRET_KEY:-dev-only-secret-change-me}"
      MAX_UPLOAD_BYTES: "52428800"
    volumes:
      - mmcm-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    image: mmcm-app:0.1.0
    command: ["web"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  mmcm-data:
